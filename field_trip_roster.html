<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Field Trip Manager — The Calculated Classroom</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Calculated Classroom brand palette ── */
  --blue:#1e3a5f;--blue-lt:#e8edf5;--blue-dk:#12263f;
  --amber:#c47f0a;--amber-lt:#fef3c7;--amber-bright:#f59e0b;
  --green:#16a34a;--green-lt:#dcfce7;
  --red:#dc2626;--red-lt:#fee2e2;
  --purple:#7c3aed;--purple-lt:#ede9fe;
  --gray:#6b7280;--gray-lt:#f3f4f6;--gray-md:#e5e7eb;
  --text:#111827;--muted:#6b7280;--radius:10px;
  --teal:#0d9488;--teal-lt:#ccfbf1;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:var(--text);min-height:100vh;font-size:15px}

/* ── Layout ── */
.topbar{background:var(--blue-dk);border-bottom:3px solid var(--amber-bright);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.brand-block{display:flex;flex-direction:column;line-height:1.15}
.brand-sub{font-size:.65rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-bright);opacity:.9}
.app-brand{font-size:.95rem;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:.01em}
.trip-name-pill{font-size:.72rem;background:var(--amber-bright);color:#fff;padding:3px 10px;border-radius:100px;font-weight:700;letter-spacing:.02em}
.topbar-btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:7px 14px;font-size:.82rem;border-radius:7px}
.topbar-btn:hover{background:rgba(255,255,255,.18)}
.topbar-btn-amber{background:var(--amber-bright);color:#fff;border:none;padding:7px 16px;font-size:.82rem;border-radius:7px}
.topbar-btn-amber:hover{opacity:.88}
.page{max-width:1000px;margin:0 auto;padding:20px 16px}

/* ── Tabs ── */
.tab-bar{display:flex;background:#fff;border:1px solid var(--gray-md);border-radius:var(--radius);padding:4px;gap:4px;margin-bottom:20px}
.tab-btn{flex:1;padding:8px 4px;border:none;background:transparent;border-radius:7px;font-family:inherit;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--blue);color:#fff}
.tab-btn:not(.active):hover{background:var(--gray-lt);color:var(--text)}
.tab-panel{display:none}.tab-panel.active{display:block}

/* ── Cards & shared ── */
.card{background:#fff;border:1px solid var(--gray-md);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card-title{font-weight:700;font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.empty-state{text-align:center;padding:32px 16px;color:var(--muted);font-size:.875rem}
h2{font-size:1.25rem;font-weight:700}
.hint{color:var(--muted);font-size:.85rem;line-height:1.5}
.section-hdr{font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}

/* ── Inputs ── */
input[type=text],input[type=url],textarea,select{
  width:100%;border:1px solid var(--gray-md);border-radius:8px;padding:9px 12px;
  font-family:inherit;font-size:.9rem;outline:none;background:#fff;color:var(--text);transition:border-color .15s}
input[type=text]:focus,input[type=url]:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
.input-row{display:flex;gap:8px;flex-wrap:wrap}
.input-row input,.input-row select{flex:1;min-width:140px}

/* ── Buttons ── */
button{font-family:inherit;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s,transform .1s;white-space:nowrap}
button:active:not(:disabled){transform:scale(.97)}
.btn{padding:9px 18px;font-size:.875rem}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.88}
.btn-ghost{background:transparent;color:var(--blue);padding:6px 10px;font-size:.875rem}.btn-ghost:hover{background:var(--blue-lt)}
.btn-sm{background:var(--gray-lt);color:var(--text);padding:6px 12px;font-size:.8rem}.btn-sm:hover{background:var(--gray-md)}
.btn-danger{background:var(--red-lt);color:var(--red);padding:5px 10px;font-size:.8rem}
.btn-icon{background:none;padding:4px 7px;font-size:.95rem;color:var(--muted)}.btn-icon:hover{color:var(--red)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{opacity:.88}
.btn-lg{padding:13px 28px;font-size:1rem;width:100%}

/* ── People lists (Students & Chaperones tabs) ── */
.people-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.people-layout{grid-template-columns:1fr}}
.person-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--gray-lt);transition:background .1s}
.person-row:last-child{border-bottom:none}
.person-row:hover{background:var(--gray-lt)}
.person-name{flex:1;font-size:.9rem;font-weight:500}
.count-badge{font-size:.72rem;background:var(--gray-lt);color:var(--muted);padding:2px 7px;border-radius:100px;font-weight:600}

/* ── Groups tab ── */
.groups-layout{display:grid;grid-template-columns:1fr;gap:16px}
.bus-block{background:#fff;border:1px solid var(--gray-md);border-radius:var(--radius);overflow:hidden}
.bus-block-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--blue);color:#fff;gap:8px}
.bus-block-hdr h3{color:#fff;font-size:.95rem}
.bus-body{padding:10px 14px}
.chap-group{border:1px solid var(--gray-md);border-radius:8px;margin-bottom:10px;overflow:hidden}
.chap-group-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--purple-lt);flex-wrap:wrap}
.chap-group-name{font-weight:700;font-size:.88rem;color:var(--purple);flex:1}
.chap-group-body{padding:8px 12px}
.student-assign-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--gray-lt)}
.student-assign-row:last-child{border-bottom:none}
.sa-name{flex:1;font-size:.88rem}
.assign-select{width:auto;flex:1;max-width:200px;padding:4px 8px;font-size:.8rem;border-radius:6px;min-width:120px}
.unassigned-block{background:#fff;border:1px dashed var(--gray-md);border-radius:var(--radius);padding:14px}
.unassigned-block .section-hdr{margin-top:0}
.unassigned-pill{display:inline-flex;align-items:center;gap:6px;background:var(--gray-lt);border-radius:6px;padding:5px 10px;margin:4px;font-size:.83rem}
.unassigned-pill select{border:none;background:transparent;font-size:.8rem;color:var(--blue);font-weight:600;padding:0;width:auto;outline:none;cursor:pointer}

/* ── Share tab ── */
.link-item{border:1px solid var(--gray-md);border-radius:8px;padding:12px;margin-top:12px}
.link-item-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.link-url{font-size:.72rem;color:var(--muted);word-break:break-all;background:var(--gray-lt);padding:6px 8px;border-radius:6px;margin-bottom:8px}
.qr-wrap{display:flex;justify-content:center;padding:8px 0}
.bus-share-label{font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;padding-top:4px;border-top:1px solid var(--gray-md)}

/* ── Dashboard ── */
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:var(--green);font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.summary-bar{display:flex;gap:20px;flex-wrap:wrap;background:#fff;border:1px solid var(--gray-md);border-radius:var(--radius);padding:14px 20px;margin-bottom:16px}
.stat{display:flex;flex-direction:column;align-items:center}
.stat-num{font-size:1.6rem;font-weight:700}
.stat-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ng{color:var(--green)}.nr{color:var(--red)}.na{color:var(--amber)}
.dash-bus{background:#fff;border:1px solid var(--gray-md);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.dash-bus-hdr{padding:10px 16px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between}
.dash-bus-hdr h3{color:#fff}
.dash-chap{border-top:1px solid var(--gray-md);padding:10px 16px}
.dash-chap-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px}
.dash-chap-name{font-weight:700;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.72rem;padding:3px 8px;border-radius:100px;font-weight:500}
.chip-p{background:var(--green-lt);color:var(--green)}
.chip-a{background:var(--red-lt);color:var(--red)}
.chip-n{background:var(--gray-lt);color:var(--gray)}
.chip-b{background:#dbeafe;color:#1d4ed8}
.chip-x{background:#fef9c3;color:#a16207}
/* Phase toggle */
.phase-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#f8fafc;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
.phase-bar-lbl{font-size:.78rem;font-weight:600;color:#6b7280;white-space:nowrap}
.phase-btn{font-size:.78rem;font-weight:700;padding:5px 14px;border-radius:100px;border:2px solid transparent;cursor:pointer;transition:all .15s}
.phase-btn.active-boarding{background:#dcfce7;color:#15803d;border-color:#16a34a}
.phase-btn.active-endofnight{background:#dbeafe;color:#1d4ed8;border-color:#2563eb}
.phase-btn.inactive{background:#f3f4f6;color:#9ca3af;border-color:transparent}
/* Dual-status chip icons */
.chip-icons{display:inline-flex;gap:2px;margin-left:4px;font-size:.65rem}

/* ── Chaperone view ── */
.chap-view-hdr{background:var(--blue-dk);border-bottom:3px solid var(--amber-bright);color:#fff;padding:14px 20px;text-align:center}
.chap-view-hdr .chap-brand{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-bright);margin-bottom:4px}
.chap-view-hdr h1{font-size:1.1rem;color:#fff;margin-bottom:2px}
.chap-view-hdr p{font-size:.8rem;opacity:.8}
.student-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--gray-md);background:#fff;gap:12px}
.student-row:last-child{border-bottom:none}
.sname{font-weight:500;font-size:.95rem;flex:1}
.sts-btns{display:flex;gap:6px;flex-shrink:0}
.sts-btn{width:80px;height:40px;border-radius:8px;font-size:.8rem;font-weight:700;border:2px solid transparent;cursor:pointer;transition:all .15s}
.sts-btn.p-btn{background:var(--green-lt);color:var(--green)}
.sts-btn.p-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
.sts-btn.a-btn{background:var(--red-lt);color:var(--red)}
.sts-btn.a-btn.on{background:var(--red);color:#fff;border-color:var(--red)}
.chap-footer{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--gray-md);padding:11px 20px;display:flex;justify-content:space-around;font-weight:700;font-size:.9rem}
.fp{color:var(--green)}.fa{color:var(--red)}.fn{color:var(--gray)}

/* ── Landing / Sign-in ── */
.landing{max-width:440px;margin:60px auto;text-align:center;background:#fff;border:1px solid var(--gray-md);border-radius:var(--radius);padding:40px 32px}
@media(max-width:480px){.landing{margin:24px auto;padding:28px 20px}.sts-btn{width:68px}}
.btn-google{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#3c4043;border:1px solid #dadce0;padding:11px 22px;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:box-shadow .15s;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn-google:hover{box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* ── My Trips home ── */
.trips-home{max-width:560px;margin:0 auto;padding:28px 16px}
.trip-card{background:#fff;border:1px solid var(--gray-md);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.trip-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.trip-card-name{font-weight:700;font-size:.95rem;flex:1}
.trip-card-date{font-size:.78rem;color:var(--muted)}
/* ── User avatar in topbar ── */
.user-avatar{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.35);object-fit:cover}
.user-name{color:rgba(255,255,255,.85);font-size:.78rem;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Footer ── */
.app-footer{background:var(--blue-dk);border-top:3px solid var(--amber-bright);color:rgba(255,255,255,.7);margin-top:48px}
.footer-inner{max-width:1000px;margin:0 auto;padding:40px 24px 28px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
@media(max-width:680px){.footer-inner{grid-template-columns:1fr 1fr;gap:24px}.footer-brand-col{grid-column:1/-1}}
.footer-brand{font-size:1rem;font-weight:700;color:#fff;margin-bottom:4px}
.footer-tagline{font-size:.78rem;color:rgba(255,255,255,.5);line-height:1.5;margin-bottom:14px}
.footer-badge{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--amber-bright);color:#fff;padding:2px 8px;border-radius:100px}
.footer-col-title{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-bright);margin-bottom:12px}
.footer-links{list-style:none;display:flex;flex-direction:column;gap:8px}
.footer-links a{color:rgba(255,255,255,.65);font-size:.83rem;text-decoration:none;transition:color .15s}
.footer-links a:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding:16px 24px;max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer-copy{font-size:.75rem;color:rgba(255,255,255,.4)}
.footer-version{font-size:.72rem;color:rgba(255,255,255,.3)}

/* ── Misc ── */
.tag{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:100px;font-weight:600;background:var(--gray-lt);color:var(--gray)}
.tag-blue{background:var(--blue-lt);color:var(--blue)}
.tag-green{background:var(--green-lt);color:var(--green)}
.tag-purple{background:var(--purple-lt);color:var(--purple)}
.tag-teal{background:var(--teal-lt);color:var(--teal)}
a{color:var(--blue)}

/* ── Sheets import ── */
.sheets-banner{background:var(--teal-lt);border:1px solid #5eead4;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.sheets-banner-icon{font-size:1.5rem;flex-shrink:0;margin-top:2px}
.sheets-banner-body{flex:1;min-width:200px}
.sheets-banner-title{font-weight:700;font-size:.9rem;color:var(--teal);margin-bottom:4px}
.sync-status{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:100px}
.sync-ok{background:var(--green-lt);color:var(--green)}
.sync-err{background:var(--red-lt);color:var(--red)}
.sync-pending{background:var(--gray-lt);color:var(--gray)}
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
const uid=()=>Math.random().toString(36).slice(2,9);
const sid=()=>Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
const autoBase=()=>['http:','https:'].includes(location.protocol)?location.origin+location.pathname:'';
const setRoot=html=>$('root').innerHTML=html;

// ═══════════════════════════════════════════════
// FIREBASE SYNC
// ═══════════════════════════════════════════════
// Config baked in — works on every device (teacher + chaperone phones)
const FB_CONFIG={
  apiKey:"AIzaSyAHJXhuKk_sYNDRQ8-OC1Aw7l90wAaW7Sg",
  authDomain:"field-trip-attendance.firebaseapp.com",
  databaseURL:"https://field-trip-attendance-default-rtdb.firebaseio.com",
  projectId:"field-trip-attendance",
  storageBucket:"field-trip-attendance.firebasestorage.app",
  messagingSenderId:"167205267344",
  appId:"1:167205267344:web:8920fa000dbb544e21b515"
};
let _fbDb=null;
function fbReady(){return!!_fbDb;}
function fbr(...parts){return _fbDb?_fbDb.ref(parts.join('/')):null;}
function fbTrip(sid,...parts){return fbr('ftr',sid,...parts);}
function fbInit(cfg){
  try{
    const c=typeof cfg==='string'?JSON.parse(cfg):cfg;
    if(!c||!c.databaseURL){console.warn('Firebase config missing databaseURL');return false;}
    try{firebase.app();}catch(e){firebase.initializeApp(c);}
    _fbDb=firebase.database();
    return true;
  }catch(e){console.error('Firebase init failed:',e);return false;}
}
function fbLoad(){
  // First try baked-in config, then fall back to localStorage
  if(FB_CONFIG.databaseURL){fbInit(FB_CONFIG);return;}
  try{const c=JSON.parse(localStorage.getItem('ftr_fb')||'null');if(c)fbInit(c);}catch(e){}
}
fbLoad();

// ═══════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════
const P=new URLSearchParams(location.search);
const VIEW=P.get('v'),SID=P.get('s'),BID=P.get('b'),CID=P.get('c');
const URL_NAMES=P.get('n'),URL_BUS=P.get('bn'),URL_CHAP=P.get('cn');
window.addEventListener('DOMContentLoaded',()=>{
  if(VIEW==='c'&&SID&&BID&&CID){initChaperone();return;}
  if(VIEW==='d'&&SID){initDashboard();return;}
  // Teacher view — requires auth
  initAuth();
});

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
// Flat, independent lists + assignment maps
let S={
  sessionId:null, tripName:'', baseUrl:autoBase(),
  students:{},    // id -> {name}
  chaperones:{},  // id -> {name}
  buses:{},       // id -> {name}
  studentChap:{}, // studentId -> chaperoneId | ''
  chapBus:{},     // chaperoneId -> busId | ''
  sheetsId:'',          // Google Sheet ID (parsed from URL)
  sheetsLastSync:'',    // last successful sync timestamp
};
let activeTab='students';

const loadS=()=>{try{const d=localStorage.getItem('ftr_v2');if(d){const p=JSON.parse(d);S={...S,...p};if(!S.baseUrl)S.baseUrl=autoBase();}}catch(e){}};
const saveS=()=>localStorage.setItem('ftr_v2',JSON.stringify(S));

// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
let currentUser=null;

function initAuth(){
  setRoot('<div style="text-align:center;padding:100px 32px;color:var(--muted)">Loading…</div>');
  firebase.auth().onAuthStateChanged(user=>{
    currentUser=user;
    if(user) initSetup();
    else renderSignIn();
  });
}

function renderSignIn(){
  setRoot(`
    <div class="landing">
      <div style="font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:8px">The Calculated Classroom</div>
      <div style="font-size:2rem;margin-bottom:10px">🚌</div>
      <h2 style="margin-bottom:8px;color:var(--blue-dk)">Field Trip Manager</h2>
      <p class="hint" style="margin-bottom:28px">Sign in to manage your trips, roster, and live check-in dashboard.</p>
      <button class="btn-google" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>

// Load all trips for current user from Firebase
function loadUserTrips(cb){
  if(!currentUser||!fbReady()){cb([]);return;}
  firebase.database().ref(`users/${currentUser.uid}/trips`).once('value',snap=>{

  });
}

function computeGroups(){
  const groups={};
  Object.entries(S.buses).forEach(([bid,b])=>{groups[bid]={name:b.name,chaps:{}};});
  Object.entries(S.chaperones).forEach(([cid,c])=>{
    const bid=S.chapBus[cid]||'';
    if(bid&&groups[bid]) groups[bid].chaps[cid]={name:c.name,students:[]};
  });
  Object.entries(S.students).forEach(([stid,st])=>{
    const cid=S.studentChap[stid]||'';
    if(!cid) return;
    const bid=S.chapBus[cid]||'';
    if(bid&&groups[bid]&&groups[bid].chaps[cid])
      groups[bid].chaps[cid].students.push({id:stid,name:st.name});
  });
  return groups;
}

function unassignedStudents(){return Object.entries(S.students).filter(([id])=>!S.studentChap[id]);}
function unassignedChaperones(){return Object.entries(S.chaperones).filter(([id])=>!S.chapBus[id]);}
function studentCount(cid){return Object.values(S.studentChap).filter(v=>v===cid).length;}

const SHEET_ID='1Qs0KsOIYRaGrQVY3m-TcgpOYI6xi6wItewcdHgOzNJ0';

// Column indices (0-based) per tab
// Chaperone List tab: A=col0 (unused), B=Last Name, C=First Name, D=col3, E=Email, F=Phone
const CL={ LAST:1, FIRST:2, EMAIL:4, PHONE:5 };
// BusesGroups tab: A=ID, B=Last, C=First, E=Ineligible, G=Paid, K=T-Shirt, M=Chaperone, O=Notes
const BG={ ID:0, LAST:1, FIRST:2, INELIGIBLE:4, PAID:6, TSHIRT:10, CHAPERONE:12, NOTES:14 };

function fetchTab(tabName){
  return new Promise((resolve,reject)=>{
    const cbName='_gviz_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{
      delete window[cbName];
      if(script.parentNode)script.parentNode.removeChild(script);
      reject(new Error(
        `Timed out loading "${tabName}".\n\n`+
        `Make sure the sheet is published:\n`+
        `File → Share → Publish to web → choose "Entire Document" → Publish`
      ));
    },20000);

    window[cbName]=function(resp){
      clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode)script.parentNode.removeChild(script);
      if(resp.status==='error'){
        reject(new Error(`Sheet error in "${tabName}": ${(resp.errors||[]).map(e=>e.message).join(', ')}`));
        return;
      }
      const table=resp.table||{cols:[],rows:[]};
      const headers=table.cols.map(c=>String(c.label||c.id||''));
      const rows=(table.rows||[]).map(row=>(row.c||[]).map(cell=>cell&&cell.v!=null?String(cell.v):''));
      resolve([headers,...rows]);
    };

    script.onerror=()=>{
      clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode)script.parentNode.removeChild(script);
      reject(new Error(`Could not load "${tabName}". Check your internet connection.`));
    };
    const url=`https://docs.google.com/spreadsheets/d/${S.sheetsId||SHEET_ID}/gviz/tq?tqx=reqId:0;out:json;responseHandler:${cbName}&sheet=${encodeURIComponent(tabName)}`;
    console.log('[Sheets] Loading tab:', tabName, url);
    script.src=url;
    document.head.appendChild(script);
  });
}

async function importFromSheets(){
  if(!S.sheetsId){alert('Paste your Google Sheet URL in the setup box above and click Save first.');return;}
  const btn=$('import-btn');
  if(btn){btn.textContent='Syncing…';btn.disabled=true;}

  try{
    // ── Fetch Students tab (required) and Chaperones tab (optional) ──
    let studentsData, chaperonsData=null;
    try{studentsData=await fetchTab('Students');}
    catch(e){throw new Error('Could not find a tab named "Students" in your sheet.\n\nRename your student list tab to exactly: Students');}
    try{chaperonsData=await fetchTab('Chaperones');}catch(e){/* optional */}

    const findCol=(headers,...terms)=>{
      for(const t of terms){const i=headers.findIndex(h=>String(h).toLowerCase().includes(t));if(i>=0)return i;}
      return -1;
    };

    const stuH=(studentsData[0]||[]);
    const sFirst=findCol(stuH,'first');
    const sLast =findCol(stuH,'last');
    const sName =findCol(stuH,'name');   // fallback single-name column
    const sBus  =findCol(stuH,'bus');
    const sChap =findCol(stuH,'chaperone','group leader','supervisor','teacher');

    if(sFirst<0&&sLast<0&&sName<0)
      throw new Error('Could not find name columns in your Students tab.\n\nAdd columns "First Name" and "Last Name" (or just "Name").');

    const stuRows=studentsData.slice(1).filter(r=>r.some(c=>String(c||'').trim()));
    const chapRows=chaperonsData?chaperonsData.slice(1).filter(r=>r.some(c=>String(c||'').trim())):[];

    const hasExisting=Object.keys(S.students).length>0||Object.keys(S.chaperones).length>0;
    if(hasExisting){
      const ok=confirm(`Replace current roster with data from Google Sheets?\n\n  ${chapRows.length} chaperones found\n  ${stuRows.length} students found\n\nThis cannot be undone.`);
      if(!ok){if(btn){btn.textContent='⬇ Sync from Google Sheets';btn.disabled=false;}return;}
    }

    S.students={};S.chaperones={};S.buses={};S.studentChap={};S.chapBus={};
    const chapKeyMap={};  // lowercase key → appId
    const busMap={};

    // ── 1. Build chaperones from Chaperones tab ──
    if(chaperonsData){
      const cH=(chaperonsData[0]||[]);
      const cFirst=findCol(cH,'first'); const cLast=findCol(cH,'last');
      const cName=findCol(cH,'name');
      const cEmail=findCol(cH,'email'); const cPhone=findCol(cH,'phone');
      const cBus=findCol(cH,'bus');
      chapRows.forEach(row=>{
        let first='',last='',name='';
        if(cFirst>=0)first=String(row[cFirst]||'').trim();
        if(cLast>=0)last=String(row[cLast]||'').trim();
        if(!first&&!last&&cName>=0){name=String(row[cName]||'').trim();const p=name.split(/\s+/);last=p.pop()||'';first=p.join(' ');}
        else name=`${first} ${last}`.trim();
        if(!name)return;
        const key=name.toLowerCase();
        if(chapKeyMap[key])return;
        const id=uid();
        S.chaperones[id]={name,firstName:first,lastName:last,
          email:cEmail>=0?String(row[cEmail]||'').trim():'',
          phone:cPhone>=0?String(row[cPhone]||'').trim():'',
        };
        chapKeyMap[key]=id;
        chapKeyMap[last.toLowerCase()]=id;
        if(cBus>=0){
          const bn=String(row[cBus]||'').trim();
          if(bn){if(!busMap[bn]){const bid=uid();S.buses[bid]={name:bn};busMap[bn]=bid;}S.chapBus[id]=busMap[bn];}
        }
      });
    }

    // ── 2. Build students from Students tab ──
    stuRows.forEach(row=>{
      let first='',last='',name='';
      if(sFirst>=0)first=String(row[sFirst]||'').trim();
      if(sLast>=0)last=String(row[sLast]||'').trim();
      if(!first&&!last&&sName>=0){name=String(row[sName]||'').trim();const p=name.split(/\s+/);last=p.pop()||'';first=p.join(' ');}
      else name=`${first} ${last}`.trim();
      if(!name)return;
      const id=uid();
      S.students[id]={name};
      if(sChap>=0){
        const chapRaw=String(row[sChap]||'').trim();
        if(chapRaw){
          let chapId=chapKeyMap[chapRaw.toLowerCase()]||chapKeyMap[chapRaw.split(/\s+/).pop().toLowerCase()]||'';
          if(!chapId){
            const p=chapRaw.split(/\s+/);const cLast=p.pop()||'';const cFirst=p.join(' ');
            const newId=uid();
            S.chaperones[newId]={name:chapRaw,firstName:cFirst,lastName:cLast,email:'',phone:''};
            chapKeyMap[chapRaw.toLowerCase()]=newId; chapKeyMap[cLast.toLowerCase()]=newId;
            chapId=newId;
          }
          S.studentChap[id]=chapId;
          if(sBus>=0&&!S.chapBus[chapId]){
            const bn=String(row[sBus]||'').trim();
            if(bn){if(!busMap[bn]){const bid=uid();S.buses[bid]={name:bn};busMap[bn]=bid;}S.chapBus[chapId]=busMap[bn];}
          }
        }
      }
    });

    S.sheetsLastSync=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    saveS();
    const stuCount=Object.keys(S.students).length,chapCount=Object.keys(S.chaperones).length,busCount=Object.keys(S.buses).length;
    activeTab=chapCount>0?'groups':'students';
    renderShell();
    alert(`✅ Sync complete!\n\n  ${chapCount} chaperones\n  ${stuCount} students\n  ${busCount} buses\n\n`+(stuCount>0?'Review assignments in the Groups tab.':'No students found — check your sheet format.'));

  }catch(err){
    alert('Sync failed:\n\n'+err.message);
  }finally{
    if(btn){btn.textContent='⬇ Sync from Google Sheets';btn.disabled=false;}
  }
}

// ── Legacy import (kept for backward compat) ──
async function importFromSheetsLegacy(){
  const btn=$('import-btn');
  if(btn){btn.textContent='Syncing...';btn.disabled=true;}

  try{
    // Fetch tabs one at a time (each gets its own isolated callback now)
    const chapListData   = await fetchTab('Chaperone List');
    const stuAllData     = await fetchTab('STUDENTS ALL');
    const groupSelData   = await fetchTab('Group Selection');

    // Build T-shirt lookup from STUDENTS ALL: studentId → tshirt
    // STUDENTS ALL columns: 0=Student ID, 1=Last, 2=First, 4=Ineligible, 6=Paid, 10=T-Shirt
    const tshirtMap = {};
    stuAllData.slice(1).forEach(row=>{
      const id = String(row[BG.ID]||'').trim().replace(/\.0$/,'');
      const ts = String(row[BG.TSHIRT]||'').trim();
      if(id) tshirtMap[id] = ts;
    });

    // Group Selection is the authoritative student list (every row = confirmed trip student)
    // Columns: A=Email/ID, B=Last Name, C=First Name, D=Chaperone, E=Bus (detected by header)
    const gsHeaders   = groupSelData[0] || [];
    const gsChapCol   = gsHeaders.findIndex(h=>{
      const hh=String(h).toLowerCase();
      return hh.includes('chaperone')||hh.includes('group leader')||hh.includes('supervisor');
    });
    const gsChapIdx = gsChapCol >= 0 ? gsChapCol : 3; // default col D
    const gsBusCol  = gsHeaders.findIndex(h=>String(h).toLowerCase().includes('bus'));
    const gsBusIdx  = gsBusCol  >= 0 ? gsBusCol  : 4; // default col E
    const gsLastRaw  = gsHeaders.findIndex(h=>/last\s*name/i.test(String(h)));
    const gsFirstRaw = gsHeaders.findIndex(h=>/first\s*name/i.test(String(h)));
    const gsLastIdx  = gsLastRaw  >= 0 ? gsLastRaw  : 1; // default col B
    const gsFirstIdx = gsFirstRaw >= 0 ? gsFirstRaw : 2; // default col C

    // Filter to rows that have a student ID in col A
    const gsRows = groupSelData.slice(1).filter(r=>String(r[0]||'').trim());

    // Chaperone List: rows where First or Last name exists
    const chapRows = chapListData.slice(1).filter(r=>(r[CL.FIRST]||'').trim()||(r[CL.LAST]||'').trim());

    // Confirm if overwriting existing data
    const hasExisting=Object.keys(S.students).length>0||Object.keys(S.chaperones).length>0;
    if(hasExisting){
      const ok=confirm(
        `Replace current roster with data from Google Sheets?\n\n`+
        `  ${chapRows.length} chaperones found\n`+
        `  ${gsRows.length} students found (from Group Selection)\n\n`+
        `This cannot be undone.`
      );
      if(!ok){if(btn){btn.textContent='⬇ Sync from Google Sheets';btn.disabled=false;}return;}
    }

    // Reset state
    S.students={};S.chaperones={};S.buses={};S.studentChap={};S.chapBus={};
    const chapKeyMap={};  // "first last" → appId
    const stuIdMap={};    // raw student ID → appId

    // ── 1. Build chaperones from "Chaperone List" tab (B=Last, C=First, E=Email, F=Phone) ──
    chapRows.forEach(row=>{
      const last =(row[CL.LAST] ||'').trim();
      const first=(row[CL.FIRST]||'').trim();
      if(!last&&!first) return;
      const fullName=`${first} ${last}`.trim();
      const key=fullName.toLowerCase();
      if(chapKeyMap[key]) return; // deduplicate
      const id=uid();
      S.chaperones[id]={
        name:     fullName,
        firstName:first,
        lastName: last,
        email:    (row[CL.EMAIL]||'').trim(),
        phone:    (row[CL.PHONE]||'').trim(),
      };
      chapKeyMap[key]=id;
    });

    // ── 2. Build students from Group Selection (all 157 confirmed trip students) ──
    const busMap={}; // bus name → appId

    gsRows.forEach(row=>{
      const rawEmail = String(row[0]||'').trim();
      // Extract numeric student ID — grab everything before '@' if email, otherwise use as-is
      const rawId = (rawEmail.indexOf('@')>=0 ? rawEmail.split('@')[0] : rawEmail).replace(/\.0$/,'').trim();

      const last  = String(row[gsLastIdx] ||'').trim();
      const first = String(row[gsFirstIdx]||'').trim();
      if(!last && !first) return;
      const name = `${first} ${last}`.trim();

      // Deduplicate by rawId
      if(rawId && stuIdMap[rawId]) return;

      const appId=uid();
      S.students[appId]={
        name,
        studentId: rawId,
        tshirt:    tshirtMap[rawId] || '',
        notes:     '',
      };
      if(rawId) stuIdMap[rawId]=appId;

      // Assign student → chaperone from Group Selection col D
      const chapRaw = String(row[gsChapIdx]||'').trim();
      const titleMatch = chapRaw.match(/^(?:Mr\.|Ms\.|Mrs\.|Dr\.)\s+([^\s(]+)/i);
      const chapName = titleMatch ? titleMatch[1].trim() : chapRaw.replace(/\s*\(.*?\)\s*/g,'').trim();
      let chapId = '';
      if(chapName){
        chapId = chapKeyMap[chapName.toLowerCase()]
          || Object.entries(chapKeyMap).find(([k])=>k.split(' ').reverse().join(' ')===chapName.toLowerCase())?.[1]
          || Object.entries(S.chaperones).find(([,c])=>c.lastName.toLowerCase()===chapName.toLowerCase())?.[0]
          || '';
        if(!chapId){
          // Auto-create for teachers/staff not in Chaperone List
          const parts=chapName.trim().split(/\s+/);
          const last=parts.pop()||''; const first=parts.join(' ');
          const newId=uid();
          S.chaperones[newId]={name:chapName,firstName:first,lastName:last,email:'',phone:''};
          chapKeyMap[chapName.toLowerCase()]=newId;
          chapId=newId;
        }
        S.studentChap[appId]=chapId;
      }

      // Assign chaperone → bus from Group Selection col E
      const busName = String(row[gsBusIdx]||'').trim();
      if(busName && chapId){
        if(!busMap[busName]){ const bid=uid();S.buses[bid]={name:busName};busMap[busName]=bid; }
        if(!S.chapBus[chapId]) S.chapBus[chapId]=busMap[busName];
      }
    });

    // Update sync timestamp
    S.sheetsLastSync=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    saveS();

    const stuCount=Object.keys(S.students).length;
    const chapCount=Object.keys(S.chaperones).length;
    const busCount=Object.keys(S.buses).length;

    activeTab=chapCount>0?'groups':'students';
    renderShell();
    alert(
      `✅ Sync complete!\n\n`+
      `  ${chapCount} chaperones\n`+
      `  ${stuCount} students\n`+
      `  ${busCount} buses\n\n`+
      (stuCount>0
        ?'Students auto-assigned to chaperones. Review in the Groups tab.'
        :'No student data found. Check that the BusesGroups tab has data.')
    );

  }catch(err){
    alert('Sync failed:\n\n'+err.message);
  }finally{
    if(btn){btn.textContent='⬇ Sync from Google Sheets';btn.disabled=false;}
  }
}

function saveSheetUrl(){
  const raw=($('sheets-url-input')?.value||'').trim();
  if(!raw){alert('Paste your Google Sheet URL first.');return;}
  // Extract sheet ID from URL like: https://docs.google.com/spreadsheets/d/SHEET_ID/edit...
  const match=raw.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  const id=match?match[1]:raw; // fall back to treating as raw ID
  if(!id||id.length<20){alert('That doesn\'t look like a valid Google Sheet URL.\n\nPaste the full URL from your browser\'s address bar.');return;}
  S.sheetsId=id;
  saveS();
  renderShell();
}

function createSession(){
  const name=($('tname').value||'').trim();
  if(!name){alert('Enter a trip name first.');return;}
  S.sessionId=sid();S.tripName=name;
  saveS();
  saveTripToAccount(S.sessionId,name);
  try{renderShell();}catch(e){alert('Error loading app: '+e.message+'\n\nTry a hard refresh (Ctrl+Shift+R).');console.error(e);}
}

function openTrip(sessionId,name){
  // If this trip matches what's in localStorage, just open it
  if(S.sessionId===sessionId){renderShell();return;}
  // Switch to this trip
  loadS(); // reload current state
  S.sessionId=sessionId;
  S.tripName=name;
  // Reset roster (roster data lives in localStorage per device)
  S.students={};S.chaperones={};S.buses={};S.studentChap={};S.chapBus={};
  S.sheetsLastSync='';
  saveS();
  renderShell();
}

function deleteTrip(sessionId,name){
  if(!confirm(`Delete "${name}"?\n\nThis removes it from your trips list. Live check-in data will also be cleared.`))return;
  // Remove from Firebase account list
  if(currentUser&&fbReady())
    firebase.database().ref(`users/${currentUser.uid}/trips/${sessionId}`).remove();
  // Clear live check-in data
  if(fbReady()) fbTrip(sessionId).remove();
  // If this was the active session, clear local state too
  if(S.sessionId===sessionId){
    S={sessionId:null,tripName:'',baseUrl:autoBase(),students:{},chaperones:{},buses:{},studentChap:{},chapBus:{},sheetsId:'',sheetsLastSync:''};
    saveS();
  }
  renderLanding();
}

function newTrip(){
  S={sessionId:null,tripName:'',baseUrl:autoBase(),students:{},chaperones:{},buses:{},studentChap:{},chapBus:{},sheetsId:'',sheetsLastSync:''};

}

function saveFbConfig(){
  let raw=($('fb-cfg-input').value||'').trim();
  if(!raw){alert('Please paste your Firebase config.');return;}
  // Extract just the { ... } block
  const s=raw.indexOf('{'),e=raw.lastIndexOf('}');
  if(s<0||e<=s){alert('Could not find a { } block. Paste the firebaseConfig object from Firebase.');return;}
  const block=raw.slice(s,e+1);
  try{
    // Evaluate as JS object literal (handles both quoted and unquoted keys)
    const cfg=new Function('return ('+block+')')();
    if(!cfg||!cfg.databaseURL){alert('Config is missing "databaseURL".\n\nMake sure you created a Realtime Database in Firebase (Build → Realtime Database) and copied the full config.');return;}
    localStorage.setItem('ftr_fb',JSON.stringify(cfg));
    if(fbInit(cfg)){alert('✅ Firebase connected! Live sync is now active.');renderShell();}
    else{alert('❌ Firebase connection failed. Check the config and try again.');}
  }catch(e){alert('Error reading config: '+e.message+'\n\nTry pasting just the { ... } block.');}}

function bulkAddStudents(){
  const el=$('bulk-stu');

function inlineRenameStudent(id, context){
  // context = 'students' (Students tab) or 'groups' (Groups tab)
  const nameEl=$(context==='groups'?`gsname-${id}`:`sname-${id}`);
  if(!nameEl||nameEl.tagName==='INPUT')return;
  const current=S.students[id]?.name||'';
  const inp=document.createElement('input');
  inp.type='text';inp.value=current;
  inp.style.cssText='flex:1;padding:4px 8px;font-size:.88rem;border:1px solid var(--blue);border-radius:6px;outline:none;width:100%';
  nameEl.replaceWith(inp);
  inp.focus();inp.select();
  const commit=()=>{
    const v=inp.value.trim();
    if(v&&v!==current){S.students[id].name=v;saveS();}
    if(context==='groups')renderGroupsTab();else renderStudentsTab();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){if(context==='groups')renderGroupsTab();else renderStudentsTab();}});
  inp.addEventListener('blur',commit);
}

              onkeydown="if(event.key==='Enter')addStudentToChap('${cid}')">
            <button class="btn-sm" style="white-space:nowrap;background:var(--green-lt);color:var(--green)" onclick="addStudentToChap('${cid}')">+ Add</button>
          </div>
        </div>
      </div>`;
    });

    busBoardHtml+=`<div class="bus-block">
      <div class="bus-block-hdr">
        <h3>🚌 ${esc(bus.name)}</h3>
        <span style="font-size:.8rem;opacity:.85">${Object.keys(bus.chaps).length} chaperone${Object.keys(bus.chaps).length!==1?'s':''}</span>

      <div class="bus-body">
        ${chapsHtml||'<p class="hint" style="padding:8px 0">No chaperones assigned to this bus yet.</p>'}
      </div>

  // Unassigned chaperones
  const unChaps=unassignedChaperones();
  const unChapHtml=unChaps.map(([cid,c])=>`
    <span class="unassigned-pill">
      👥 ${esc(c.name)}
      <select class="assign-select" style="max-width:none;border:none;background:transparent;color:var(--blue);font-weight:600;padding:0;width:auto;cursor:pointer" onchange="reassignChaperone('${cid}',this.value)">
        <option value="">Assign to bus →</option>
        ${busOptions}
      </select>
    </span>`).join('');

  // Unassigned students
  const unStus=unassignedStudents();
  const unStuHtml=unStus.map(([sid,st])=>`
    <span class="unassigned-pill">
      ${esc(st.name)}
      <select class="assign-select" style="max-width:none;border:none;background:transparent;color:var(--blue);font-weight:600;padding:0;width:auto;cursor:pointer" onchange="reassignStudent('${sid}',this.value)">
        <option value="">Assign to →</option>
        ${chapOptions}
      </select>
    </span>`).join('');

  $('tab-groups').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr;gap:16px">
      ${busBoardHtml||'<div class="card"><p class="hint" style="text-align:center">Add buses in the Chaperones tab.</p></div>'}

      ${(unChaps.length||unStus.length)?`<div class="unassigned-block">
        ${unChaps.length?`<div class="section-hdr">Unassigned Chaperones</div><div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:10px">${unChapHtml}</div>`:''}
        ${unStus.length?`<div class="section-hdr">Unassigned Students</div><div style="display:flex;flex-wrap:wrap;gap:2px">${unStuHtml}</div>`:''}
      </div>`:''}
    </div>
  `;
}

function reassignStudent(sid,cid){
  if(cid==='__unassign') S.studentChap[sid]='';
  else if(cid) S.studentChap[sid]=cid;
  else return;
  saveS();renderGroupsTab();
}

function reassignChaperone(cid,bid){
  if(bid==='__unassign') S.chapBus[cid]='';
  else if(bid) S.chapBus[cid]=bid;
  else return;
  saveS();renderGroupsTab();
}

function addStudentToChap(cid){
  const inp=$(`qadd-${cid}`);
  if(!inp)return;
  const name=inp.value.trim();
  if(!name)return;
  const id=uid();
  S.students[id]={name};
  S.studentChap[id]=cid;
  saveS();renderGroupsTab();
}

function removeStudentFromGroup(sid){
  S.studentChap[sid]='';
  saveS();renderGroupsTab();
}

function generateLinks(){
  const base=($('base-url').value||'').trim();
  S.baseUrl=base;saveS();
  if(!base){alert('Please enter the hosted URL of this file.');return;}

  const groups=computeGroups();
  const sortBusEntries=e=>e.sort(([,a],[,b])=>{const n=s=>parseInt((s.name||'').replace(/\D+/g,''))||0;return n(a)-n(b)||(a.name||'').localeCompare(b.name||'');});
  const busEntries=sortBusEntries(Object.entries(groups));
  if(!busEntries.length){alert('Set up buses in the Chaperones tab first.');return;}

  // Push group structure to Firebase — replace entirely to avoid stale data
  if(!fbReady()){alert('⚠️ Firebase is not configured — live sync will not work.\n\nGo to Setup → Live Sync to add your Firebase config.');return;}
  // Build the complete buses object, then set() it all at once (wipes old data cleanly)
  const busesData={};
  busEntries.forEach(([bid,bus])=>{
    busesData[bid]={name:bus.name,chaps:{}};
    Object.entries(bus.chaps).forEach(([cid,chap])=>{
      busesData[bid].chaps[cid]={name:chap.name,count:chap.students.length,students:{}};
      chap.students.forEach((st,i)=>{
        busesData[bid].chaps[cid].students['s'+i]={name:st.name,status:'',boardingStatus:''};
      });
    });
  });
  // Count totals for confirmation banner
  const totalBuses=Object.keys(busesData).length;
  const totalStudents=Object.values(busesData).reduce((sum,bus)=>sum+Object.values(bus.chaps||{}).reduce((s2,ch)=>s2+Object.keys(ch.students||{}).length,0),0);

  fbTrip(S.sessionId).set({tripName:S.tripName||'',buses:busesData})
    .then(()=>{
      const banner=$('fb-push-banner');
      if(banner){
        banner.textContent=`✅ Firebase updated — ${totalBuses} bus${totalBuses!==1?'es':''}, ${totalStudents} student${totalStudents!==1?'s':''} — all previous data cleared`;
        banner.style.display='block';
        clearTimeout(banner._t);
        banner._t=setTimeout(()=>{banner.style.display='none';},8000);
      }
    })
    .catch(err=>{
      const banner=$('fb-push-banner');
      if(banner){
        banner.textContent='❌ Firebase write failed: '+err.message;
        banner.style.color='#dc2626';
        banner.style.display='block';
      }
    });

  let html='';
  const qrItems=[];
  busEntries.forEach(([bid,bus])=>{
    const chapEntries=Object.entries(bus.chaps);
    if(!chapEntries.length)return;
    html+=`<div class="bus-share-label">🚌 ${esc(bus.name)}</div>`;
    chapEntries.forEach(([cid,chap])=>{
      // Encode student names in URL so roster loads instantly (no GUN wait)
      const namesParam=encodeURIComponent(chap.students.map(s=>s.name).join('|'));
      const link=`${base}?v=c&s=${S.sessionId}&b=${bid}&c=${cid}&n=${namesParam}&bn=${encodeURIComponent(bus.name)}&cn=${encodeURIComponent(chap.name)}`;
      const qid=`qr-${bid}-${cid}`;
      html+=`<div class="link-item">
        <div class="link-item-hdr">
          <div>
            <strong>${esc(chap.name)}</strong>
            <span class="tag" style="margin-left:6px">${chap.students.length} student${chap.students.length!==1?'s':''}</span>
          </div>
          <button class="btn-sm" onclick="copyText('${esc(link)}',this)">Copy Link</button>
        </div>
        <div class="link-url">${esc(link)}</div>
        <div class="qr-wrap" id="${qid}"></div>
      </div>`;
      qrItems.push({qid,link});
    });
  });

  if(!html){alert('No grouped chaperones found. Assign chaperones to buses in the Groups tab first.');return;}

  // Save generated links so they survive tab switches and page refreshes
  S.generatedLinks=qrItems.map(({qid,link})=>({qid,link}));
  saveS();

  $('links-out').innerHTML=`
    <div style="margin-bottom:12px">
      <button class="btn btn-primary" onclick="printLinks()" style="display:inline-flex;align-items:center;gap:6px">
        🖨️ Download / Print PDF
      </button>
      <span class="hint" style="margin-left:10px">Opens a print-ready page — use "Save as PDF" in the print dialog</span>
    </div>
    ${html}`;
  qrItems.forEach(({qid,link})=>{
    try{new QRCode($(qid),{text:link,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});}catch(e){}
  });
}

// DASHBOARD
// ═══════════════════════════════════════════════
let DS={}; // computed from local setup + Gun live updates
let dashPhase='boarding'; // 'boarding' | 'endofnight'
let lastDashPoll=Date.now();

function initDashboard(){
  loadS();
  DS={};
  setRoot('<div style="text-align:center;padding:80px 32px;color:#6b7280;font-size:1rem">⏳ Loading dashboard...</div>');
  if(!fbReady()){
    // No Firebase — fall back to local setup only
    buildDSFromLocal();renderDashView();return;
  }
  // Load trip name + full group structure from Firebase (works on any device)
  fbTrip(SID,'tripName').once('value',snap=>{if(snap.val())S.tripName=snap.val();});
  fbTrip(SID,'buses').once('value',snap=>{
    const busData=snap.val()||{};
    if(Object.keys(busData).length){
      buildDSFromFirebase(busData);
    } else {
      buildDSFromLocal(); // teacher's device before Generate Links clicked
    }
    renderDashView();
    setupDashSubscriptions();
  });
  fbTrip(SID,'phase').on('value',snap=>{dashPhase=snap.val()||'boarding';renderDashView();});
  setInterval(updatePollLabel,3000);
}

function buildDSFromLocal(){
  const groups=computeGroups();
  DS={};
  Object.entries(groups).forEach(([bid,bus])=>{
    DS[bid]={name:bus.name,chaps:{}};
    Object.entries(bus.chaps).forEach(([cid,chap])=>{
      DS[bid].chaps[cid]={name:chap.name,submitted:false,students:{}};
      chap.students.forEach((st,i)=>{DS[bid].chaps[cid].students['s'+i]={name:st.name,status:'',boardingStatus:''};});
    });
  });
}

function buildDSFromFirebase(busData){
  DS={};
  Object.entries(busData).forEach(([bid,bus])=>{
    if(!bus||!bus.name)return;
    DS[bid]={name:bus.name,chaps:{}};
    Object.entries(bus.chaps||{}).forEach(([cid,chap])=>{
      DS[bid].chaps[cid]={name:chap.name||'',submitted:chap.submitted||false,students:{}};
      Object.entries(chap.students||{}).forEach(([sId,st])=>{
        DS[bid].chaps[cid].students[sId]={name:st.name||'',status:st.status||'',boardingStatus:st.boardingStatus||''};
      });
    });
  });
}

function setupDashSubscriptions(){
  Object.entries(DS).forEach(([bid])=>{
    Object.keys(DS[bid].chaps).forEach(cid=>{
      fbTrip(SID,'buses',bid,'chaps',cid,'students').on('value',snap=>{
        const data=snap.val()||{};
        Object.entries(data).forEach(([sId,st])=>{
          if(!DS[bid]?.chaps[cid]?.students[sId])return;
          DS[bid].chaps[cid].students[sId].status=st.status||'';
          DS[bid].chaps[cid].students[sId].boardingStatus=st.boardingStatus||'';
        });
        refreshDashStats();
      });
      fbTrip(SID,'buses',bid,'chaps',cid,'submitted').on('value',snap=>{
        if(!DS[bid]?.chaps[cid])return;
        DS[bid].chaps[cid].submitted=snap.val()||false;
        refreshDashStats();
      });
    });
  });
}

function forceRefresh(){
  if(!fbReady())return;
  Object.entries(DS).forEach(([bid])=>{
    Object.keys(DS[bid].chaps).forEach(cid=>{
      fbTrip(SID,'buses',bid,'chaps',cid,'students').once('value',snap=>{
        const data=snap.val()||{};
        Object.entries(data).forEach(([sId,st])=>{
          if(!DS[bid]?.chaps[cid]?.students[sId])return;
          DS[bid].chaps[cid].students[sId].status=st.status||'';
          DS[bid].chaps[cid].students[sId].boardingStatus=st.boardingStatus||'';
        });
        refreshDashStats();
      });
    });
  });
  lastDashPoll=Date.now();
  updatePollLabel();
}

function updatePollLabel(){
  const el=$('poll-lbl');
  if(!el)return;
  const sec=Math.round((Date.now()-lastDashPoll)/1000);
  el.textContent=sec<5?'just now':sec+'s ago';
}

function setPhase(phase){
  dashPhase=phase;
  if(fbReady())fbTrip(SID,'phase').set(phase);
  renderDashView();
}

function showDashQR(){
  const dashUrl=location.href.split('?')[0]+'?v=d&s='+SID;
  // Create modal overlay
  const overlay=document.createElement('div');
  overlay.id='dash-qr-modal';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  overlay.innerHTML=`
    <div style="background:#fff;border-radius:16px;padding:28px 32px;text-align:center;max-width:320px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)">
      <div style="font-size:1.1rem;font-weight:800;margin-bottom:4px">📊 Live Dashboard</div>
      <div style="font-size:.8rem;color:#6b7280;margin-bottom:16px">Scan to open the live board on any device</div>
      <div id="dash-qr-code" style="display:inline-block;padding:8px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:16px"></div>

function calcSubmittedCount(){
  let done=0,total=0;
  Object.values(DS).forEach(b=>{if(!b||!b.chaps)return;Object.values(b.chaps).forEach(c=>{total++;if(c.submitted)done++;});});
  return total?`${done}/${total} chaperones submitted`:'';
}

function calcStats(){
  let total=0,checked=0,missing=0,pending=0;
  Object.values(DS).forEach(b=>{
    if(!b||!b.chaps)return;
    Object.values(b.chaps).forEach(c=>Object.values(c.students).forEach(s=>{
      total++;
      const st=dashPhase==='boarding'?(s.status||''):(s.boardingStatus||'');
      if(st==='present'||st==='boarded')checked++;
      else if(st==='absent'||st==='missing')missing++;
      else pending++;
    }));
  });
  return{total,checked,missing,pending};
}

function chipClass(s){
  if(dashPhase==='boarding') return s.status==='present'?'chip-p':s.status==='absent'?'chip-a':'chip-n';
  return s.boardingStatus==='boarded'?'chip-b':s.boardingStatus==='missing'?'chip-x':'chip-n';
}
function dualIcon(s){
  const arr=s.status==='present'?'<span title="On bus" style="color:#16a34a">✓</span>':s.status==='absent'?'<span title="Not on bus" style="color:#dc2626">✗</span>':'<span style="color:#d1d5db">·</span>';
  const eod=s.boardingStatus==='boarded'?'<span title="End of night ✓" style="color:#1d4ed8">🌙</span>':s.boardingStatus==='missing'?'<span title="End of night missing" style="color:#a16207">⚠</span>':'<span style="color:#d1d5db">·</span>';
  return`<span class="chip-icons">${arr}${eod}</span>`;
}

function renderDashView(){
  const {total,checked,missing,pending}=calcStats();
  const isBoarding=dashPhase==='boarding';
  const checkedLbl=isBoarding?'On Bus':'On Bus';
  const missingLbl=isBoarding?'Absent':'Missing';

  const busHtml=Object.entries(DS).filter(([,b])=>b&&b.chaps).sort(([,a],[,b])=>{
    const n=s=>parseInt((s.name||'').replace(/\D+/g,''))||0;
    return n(a)-n(b)||(a.name||'').localeCompare(b.name||'');
  }).map(([bid,bus])=>{
    const chapHtml=Object.entries(bus.chaps).map(([cid,chap])=>{
      const stus=Object.entries(chap.students);
      const p=stus.filter(([,s])=>isBoarding?(s.status==='present'):(s.boardingStatus==='boarded')).length;
      const a=stus.filter(([,s])=>isBoarding?(s.status==='absent'):(s.boardingStatus==='missing')).length;
      const n=stus.length-p-a;
      const chips=stus.map(([,s])=>`<span class="chip ${chipClass(s)}">${esc(s.name)}${dualIcon(s)}</span>`).join('');
      const subBadge=chap.submitted?'<span style="font-size:.7rem;background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:100px;font-weight:700;border:1px solid #86efac">✓ submitted</span>':'';
      return`<div class="dash-chap">
        <div class="dash-chap-hdr">
          <span class="dash-chap-name" id="cn-${cid}">${esc(chap.name)} ${subBadge}</span>
          <span id="cc-${cid}" style="display:flex;gap:4px;flex-wrap:wrap">
            <span style="font-size:.72rem;background:${isBoarding?'#dcfce7':'#dbeafe'};color:${isBoarding?'#16a34a':'#1d4ed8'};padding:2px 7px;border-radius:4px;font-weight:600">${p} ${checkedLbl.toLowerCase()}</span>
            ${a?`<span style="font-size:.72rem;background:${isBoarding?'#fee2e2':'#fef9c3'};color:${isBoarding?'#dc2626':'#a16207'};padding:2px 7px;border-radius:4px;font-weight:600">${a} ${missingLbl.toLowerCase()}</span>`:''}
            ${n?`<span style="font-size:.72rem;background:#f3f4f6;color:#6b7280;padding:2px 7px;border-radius:4px;font-weight:600">${n} pending</span>`:''}
          </span>
        </div>
        <div class="chips" id="sc-${cid}">${chips}</div>
      </div>`;
    }).join('');
    return`<div class="dash-bus">
      <div class="dash-bus-hdr"><h3>${esc(bus.name)}</h3></div>
      <div>${chapHtml}</div>
    </div>`;
  }).join('');

  setRoot(`<div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="brand-block">
        <span class="brand-sub">The Calculated Classroom</span>
        <span class="app-brand">${esc(S.tripName||'Field Trip Manager')}</span>
      </div>
      <div class="live-badge" style="color:var(--amber-bright);margin-left:4px"><span class="live-dot" style="background:var(--amber-bright)"></span> Live</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="topbar-btn" onclick="showDashQR()" title="QR code for this dashboard">📱 QR</button>
      <button class="topbar-btn" onclick="history.back()">← Setup</button>
    </div>
  </div>
  <div class="phase-bar">
    <span class="phase-bar-lbl">Check-In Phase:</span>
    <button class="phase-btn ${isBoarding?'active-boarding':'inactive'}" onclick="setPhase('boarding')">🚌 Boarding</button>
    <button class="phase-btn ${!isBoarding?'active-endofnight':'inactive'}" onclick="setPhase('endofnight')">🌙 End of Night</button>
  </div>
  <div class="page">
    <div class="summary-bar">
      <div class="stat"><span class="stat-num">${total}</span><span class="stat-lbl">Total</span></div>
      <div class="stat"><span class="stat-num ng" id="sp">${checked}</span><span class="stat-lbl">${checkedLbl}</span></div>
      <div class="stat"><span class="stat-num nr" id="sa">${missing}</span><span class="stat-lbl">${missingLbl}</span></div>
      <div class="stat"><span class="stat-num na" id="sn">${pending}</span><span class="stat-lbl">Pending</span></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 16px 6px;font-size:.7rem;color:#9ca3af">
      <span id="sub-count">${calcSubmittedCount()}</span>
      <span>🔄 Updated: <span id="poll-lbl">just now</span> · <button onclick="forceRefresh()" style="background:none;border:none;color:#6b7280;font-size:.7rem;cursor:pointer;text-decoration:underline;padding:0">Refresh now</button></span>
    </div>
    ${busHtml||'<p class="hint" style="text-align:center;padding:32px">No groups found. Return to setup.</p>'}
  </div>`);
}

function refreshDashStats(){
  const {checked,missing,pending}=calcStats();
  const isBoarding=dashPhase==='boarding';
  const checkedLbl=isBoarding?'on bus':'on bus';
  const missingLbl=isBoarding?'absent':'missing';
  if($('sp')){$('sp').textContent=checked;$('sa').textContent=missing;$('sn').textContent=pending;}
  const sc2=$('sub-count'); if(sc2)sc2.textContent=calcSubmittedCount();
  Object.entries(DS).forEach(([,bus])=>{
    if(!bus||!bus.chaps)return;
    Object.entries(bus.chaps).forEach(([cid,chap])=>{
      const stus=Object.entries(chap.students);
      const p=stus.filter(([,s])=>isBoarding?(s.status==='present'):(s.boardingStatus==='boarded')).length;
      const a=stus.filter(([,s])=>isBoarding?(s.status==='absent'):(s.boardingStatus==='missing')).length;
      const n=stus.length-p-a;
      const cc=$('cc-'+cid);
      if(cc)cc.innerHTML=`
        <span style="font-size:.72rem;background:${isBoarding?'#dcfce7':'#dbeafe'};color:${isBoarding?'#16a34a':'#1d4ed8'};padding:2px 7px;border-radius:4px;font-weight:600">${p} ${checkedLbl}</span>
        ${a?`<span style="font-size:.72rem;background:${isBoarding?'#fee2e2':'#fef9c3'};color:${isBoarding?'#dc2626':'#a16207'};padding:2px 7px;border-radius:4px;font-weight:600">${a} ${missingLbl}</span>`:''}
        ${n?`<span style="font-size:.72rem;background:#f3f4f6;color:#6b7280;padding:2px 7px;border-radius:4px;font-weight:600">${n} pending</span>`:''}`;
      const subBadge=chap.submitted?'<span style="font-size:.7rem;background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:100px;font-weight:700;border:1px solid #86efac">✓ submitted</span>':'';
      const cn=$('cn-'+cid); if(cn)cn.innerHTML=esc(chap.name)+' '+subBadge;
      const sc=$('sc-'+cid);
      if(sc)sc.innerHTML=stus.map(([,s])=>`<span class="chip ${chipClass(s)}">${esc(s.name)}${dualIcon(s)}</span>`).join('');
    });
  });
}

// ═══════════════════════════════════════════════
// CHAPERONE VIEW
// ═══════════════════════════════════════════════
let CV={busName:'',chapName:'',students:{}};
let chapPhase='boarding'; // synced from GUN: 'boarding' | 'endofnight'

function initChaperone(){
  // Pre-populate names from URL params instantly
  if(URL_BUS) CV.busName=decodeURIComponent(URL_BUS);
  if(URL_CHAP) CV.chapName=decodeURIComponent(URL_CHAP);
  if(URL_NAMES){
    decodeURIComponent(URL_NAMES).split('|').forEach((name,i)=>{
      if(name) CV.students['s'+i]={name,status:'',boardingStatus:''};
    });
  }
  renderChapView();
  if(!fbReady())return;
  // Firebase: listen for phase changes from teacher
  fbTrip(SID,'phase').on('value',snap=>{
    chapPhase=snap.val()||'boarding';
    renderChapView();
  });
  // Firebase: listen for status updates (e.g. if teacher resets)
  fbTrip(SID,'buses',BID,'chaps',CID,'students').on('value',snap=>{
    const data=snap.val()||{};
    Object.entries(data).forEach(([sId,st])=>{
      if(!CV.students[sId])CV.students[sId]={};
      CV.students[sId].name=st.name||CV.students[sId].name||'';
      CV.students[sId].status=st.status||'';
      CV.students[sId].boardingStatus=st.boardingStatus||'';
    });
    renderChapView();
  });
}

function setStatus(sId,value){
  const field=chapPhase==='boarding'?'status':'boardingStatus';
  const cur=CV.students[sId]?.[field];
  const next=cur===value?'':value;
  CV.students[sId][field]=next;
  if(fbReady())fbTrip(SID,'buses',BID,'chaps',CID,'students',sId).update({[field]:next});
  renderChapView();
}

function renderChapView(){
  const sorted=Object.entries(CV.students).sort(([a],[b])=>parseInt(a.slice(1))-parseInt(b.slice(1)));
  const isBoarding=chapPhase==='boarding';

  const checked=sorted.filter(([,s])=>isBoarding?s.status==='present':s.boardingStatus==='boarded').length;
  const missing=sorted.filter(([,s])=>isBoarding?s.status==='absent':s.boardingStatus==='missing').length;
  const pending=sorted.length-checked-missing;

  const phaseLabel=isBoarding?'Boarding':'End of Night';
  const phaseColor=isBoarding?'var(--blue)':'#1d4ed8';
  const yesLabel=isBoarding?'On Bus':'On Bus';
  const noLabel=isBoarding?'Absent':'Missing';
  const yesVal=isBoarding?'present':'boarded';
  const noVal=isBoarding?'absent':'missing';

  const rows=sorted.map(([sId,s])=>{
    const curVal=isBoarding?(s.status||''):(s.boardingStatus||'');
    // During End of Night, show boarding status as a small indicator
    const priorIcon=isBoarding?'':(s.status==='present'?' <span style="font-size:.7rem;color:#16a34a">✓boarded</span>':s.status==='absent'?' <span style="font-size:.7rem;color:#dc2626">✗absent</span>':'');
    return`<div class="student-row">
      <span class="sname">${esc(s.name)}${priorIcon}</span>
      <div class="sts-btns">
        <button class="sts-btn p-btn${curVal===yesVal?' on':''}" onclick="setStatus('${sId}','${yesVal}')">${yesLabel}</button>
        <button class="sts-btn a-btn${curVal===noVal?' on':''}" onclick="setStatus('${sId}','${noVal}')">${noLabel}</button>
      </div>
    </div>`;
  }).join('');

  setRoot(`<div style="min-height:100vh;display:flex;flex-direction:column">
    <div class="chap-view-hdr" style="background:${phaseColor}">
      <div class="chap-brand">The Calculated Classroom · Field Trip Manager</div>
      <h1>${esc(CV.busName||'Bus')} — ${esc(CV.chapName||'Chaperone')}</h1>
      <p>Tap a student to mark them</p>
    </div>
    <div class="phase-bar">
      <span class="phase-bar-lbl">Phase:</span>
      <button class="phase-btn ${isBoarding?'active-boarding':'inactive'}" onclick="setChapPhase('boarding')">🚌 Boarding</button>
      <button class="phase-btn ${!isBoarding?'active-endofnight':'inactive'}" onclick="setChapPhase('endofnight')">🌙 End of Night</button>
    </div>
    <div style="flex:1">
      ${rows||'<p style="padding:32px;text-align:center;color:#6b7280">No students loaded.<br>Check your connection and refresh.</p>'}
    </div>
    <div class="chap-footer">
      <span class="fp">✓ ${checked} On Bus</span>
      <span class="fa">✕ ${missing} ${isBoarding?'Absent':'Missing'}</span>
      <span class="fn">○ ${pending} Pending</span>
    </div>
    <div style="padding:12px 16px 20px;background:#fff;border-top:1px solid #e5e7eb">
      <button class="btn btn-primary" style="width:100%;font-size:1rem;padding:12px" onclick="submitCheckIn()">✅ Submit Check-In</button>
    </div>
  </div>`);
}

function setChapPhase(phase){
  chapPhase=phase;
  renderChapView();
}

function submitCheckIn(){
  const sorted=Object.entries(CV.students);
  const isBoarding=chapPhase==='boarding';
  const checked=sorted.filter(([,s])=>isBoarding?s.status==='present':s.boardingStatus==='boarded').length;
  const absent=sorted.filter(([,s])=>isBoarding?s.status==='absent':s.boardingStatus==='missing').length;
  const pending=sorted.length-checked-absent;
  const phaseLabel=isBoarding?'Boarding':'End of Night';
  const absentLabel=isBoarding?'Absent':'Missing';
  const msg=`Submit ${phaseLabel} check-in?\n\n✓ ${checked} On Bus\n✕ ${absent} ${absentLabel}\n○ ${pending} Pending${pending>0?'\n\n⚠️ '+pending+' student(s) not yet marked.':'\n\n✅ All students marked!'}`;
  if(!confirm(msg))return;
  if(fbReady())fbTrip(SID,'buses',BID,'chaps',CID,'submitted').set(true);
  setRoot(`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:#f9fafb">
    <div style="font-size:3.5rem;margin-bottom:12px">✅</div>
    <h2 style="font-size:1.4rem;font-weight:800;color:#15803d;margin-bottom:6px">Check-In Submitted!</h2>
    <p style="color:#6b7280;margin-bottom:20px;font-size:.9rem">${esc(phaseLabel)} · ${esc(CV.busName)} — ${esc(CV.chapName)}</p>
    <div style="background:#fff;border:1px solid #d1fae5;border-radius:12px;padding:16px 28px;margin-bottom:24px;min-width:200px;box-shadow:0 1px 4px rgba(0,0,0,.06)">
      <div style="font-size:1.1rem;font-weight:700;color:#16a34a;padding:4px 0">✓ ${checked} On Bus</div>
      <div style="font-size:1.1rem;font-weight:700;color:#dc2626;padding:4px 0">✕ ${absent} ${esc(absentLabel)}</div>
      ${pending?`<div style="font-size:1.1rem;font-weight:700;color:#9ca3af;padding:4px 0">○ ${pending} Pending</div>`:''}
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px">
      <button class="btn btn-primary" onclick="renderChapView()" style="padding:12px;font-size:1rem">Continue →</button>
      <button class="btn" onclick="if(fbReady())fbTrip(SID,'buses',BID,'chaps',CID,'submitted').set(false);renderChapView()" style="background:#f3f4f6;color:#374151;border:none;padding:10px 24px">← Edit Check-In</button>
    </div>
  </div>`);
}
</script>
